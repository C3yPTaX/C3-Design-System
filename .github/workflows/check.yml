name: Prüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pillow, NumPy und resvg-py installieren
        run: pip install pillow numpy resvg-py

      - name: Design-System prüfen
        run: python scripts/check.py

      - name: Abgeleitete Assets reproduzierbar
        run: |
          python scripts/build-assets.py
          python scripts/build-wallpapers.py
          for n in upload film; do python scripts/build-product-icon.py examples/product-icons/symbols/$n.svg examples/product-icons/$n; done
          for n in c3-designsystem c3-cleanup c3-television; do python scripts/build-product-icon.py assets/product-icon/$n/produktzeichen.svg assets/product-icon/$n --name $n; done
          git status --porcelain assets examples/product-icons
          test -z "$(git status --porcelain assets examples/product-icons)" || echo "::warning::Neu erzeugte Assets weichen ab. Bitte die Build-Skripte in scripts/ lokal ausführen."

      - name: PowerShell-Syntax prüfen
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($failed) { exit 1 }
          . ./tokens/c3-theme.ps1
          if ($C3.Color.Accent.Default.ToArgb() -ne [System.Drawing.Color]::FromArgb(255, 25, 212, 220).ToArgb()) { throw 'c3-theme.ps1 liefert falsche Werte' }
          Write-Host "PowerShell-Dateien in Ordnung."
